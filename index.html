<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<title>Dompet Digital</title>
<div class="container">
    <!-- semua dashboard + catat + riwayat -->
  </div>
<style><style>
  .app{
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  background:#0f1115;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

body{
  background:#0f1115;
  color:#fff;
  padding-bottom:90px;
}

/* HEADER */
header{
  padding:20px;
  text-align:left;
  position:sticky;
  top:0;
  background:#0f1115;
  z-index:10;
}

header h1{
  font-size:18px;
  font-weight:600;
}

#tanggalSekarang{
  font-size:12px;
  color:#888;
  margin-top:4px;
}

/* CONTAINER */
.container{
  padding:15px;
}

/* CARD CLEAN */
.card{
  background:#171a21;
  border:1px solid #222632;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

/* SALDO HERO */
.saldo{
  font-size:32px;
  font-weight:700;
  margin-top:8px;
  color:#4ade80;
}

/* INPUT CLEAN */
input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #2a2f3a;
  background:#0f1115;
  color:#fff;
  outline:none;
  margin-top:6px;
}

textarea{
  height:70px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#4ade80;
  color:#000;
  font-weight:600;
  margin-top:10px;
}

/* NAV BAR CLEAN */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#12141a;
  border-top:1px solid #222632;
}

.nav button{
  background:none;
  color:#aaa;
  font-size:12px;
  padding:12px;
  flex:1;
}

/* ITEM LIST */
.item{
  padding:12px 0;
  border-bottom:1px solid #222632;
}

.small{
  color:#888;
  font-size:12px;
}

.green{ color:#4ade80; }
.red{ color:#fb7185; }

.editBtn{
  background:#f59e0b;
  color:#000;
  margin-top:8px;
}

.deleteBtn{
  background:#ef4444;
}

/* RUNNING TEXT CLEAN */
.runningText{
  position:fixed;
  bottom:50px;
  left:0;
  right:0;
  background:#12141a;
  color:#888;
  font-size:12px;
  padding:6px;
  border-top:1px solid #222632;
}
</style>
</style>
</head>

<body>

<header>
🏦 Dompet Digital
<div id="tanggalSekarang"></div>
</header>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">

  <div class="card">
    <div>Saldo Anda</div>
    <div class="saldo" id="saldo">Rp0</div>
  </div>

  <div class="card">
    <p>💵 Pemasukan: <b id="masuk">Rp0</b></p>
    <p>📉 Pengeluaran: <b id="keluar">Rp0</b></p>
  </div>

  <div class="card">
    <h3>📊 Dana Tetap</h3>
    <p>Tabungan: <b id="tabunganManual">Rp0</b></p>
    <p>BPJS: <b id="bpjsManual">Rp0</b></p>
    <p>Mahesa: <b id="mahesaManual">Rp0</b></p>
  </div>

  <div class="card">
    <h3>💼 Gaji Masuk</h3>
    <div id="gajiList"></div>
  </div>

</div>

<!-- CATAT -->
<div id="catat" class="page">

  <div class="card">
    <h3>➕ Catat Transaksi</h3>

    <label>Jenis</label>
    <select id="jenis">
      <option value="masuk">Pemasukan</option>
      <option value="keluar">Pengeluaran</option>
      <option value="tabungan">Tabungan</option>
      <option value="bpjs">BPJS</option>
      <option value="mahesa">Mahesa</option>
    </select>

    <label>Tanggal</label>
    <input type="date" id="tanggal">

    <label>Nominal</label>
    <input type="text" id="nominal" oninput="formatNominal(this)">

    <label>Kategori</label>
    <input type="text" id="kategori">

    <label>Catatan</label>
    <textarea id="catatan"></textarea>

    <button onclick="tambah()">Simpan</button>
  </div>

</div>

<!-- RIWAYAT -->
<div id="riwayat" class="page">

  <div class="card">
    <h3>📜 Riwayat</h3>
    <div id="list"></div>
  </div>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('dashboard')">🏠 Home</button>
<button onclick="showPage('catat')">➕ Catat</button>
<button onclick="showPage('riwayat')">📜 Riwayat</button>
</div>

<script>

const sbUrl = "https://jhaubwkvvqyzogmwhxmo.supabase.co";

const sbKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoYXVid2t2dnF5em9nbXdoeG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzc5NjYsImV4cCI6MjA5NTgxMzk2Nn0.7PRY0wxN5ZQzXkLgVdnLGdVJyiiad5LIs3WGDbuzieM";

const sb = supabase.createClient(sbUrl, sbKey);

let data = [];
let editIndex = -1;

function rupiah(n){
  return "Rp " + Number(n || 0).toLocaleString('id-ID');
}

function formatNominal(input){
  let angka = input.value.replace(/\D/g,'');
  if(!angka) return input.value = "";
  input.value = "Rp " + Number(angka).toLocaleString('id-ID');
}

function tampilTanggal(){
  const bulan = [
    "Januari","Februari","Maret","April","Mei","Juni",
    "Juli","Agustus","September","Oktober","November","Desember"
  ];

  const tgl = new Date();
  document.getElementById("tanggalSekarang").innerText =
  tgl.getDate()+" "+bulan[tgl.getMonth()]+" "+tgl.getFullYear();
}

function formatTanggal(t){
  return new Date(t).toLocaleDateString('id-ID',{
    day:'numeric',month:'long',year:'numeric'
  });
}

async function loadData(){
  const { data: hasil, error } = await sb
    .from('transaksi')
    .select('*')
    .order('tanggal',{ascending:false});

  if(error){
    alert("Gagal load data");
    return;
  }

  data = hasil || [];
  render();
}

async function tambah(){

  let nominalAngka = Number(nominal.value.replace(/\D/g,''));

  let trx = {
    jenis: jenis.value,
    tanggal: tanggal.value || new Date().toISOString().split('T')[0],
    nominal: nominalAngka,
    kategori: kategori.value,
    catatan: catatan.value
  };

  if(!trx.nominal){
    alert("Nominal kosong");
    return;
  }

  if(editIndex === -1){
    await sb.from('transaksi').insert([trx]);
  } else {
    await sb.from('transaksi')
      .update(trx)
      .eq('id', data[editIndex].id);

    editIndex = -1;
  }

  nominal.value = "";
  kategori.value = "";
  catatan.value = "";

  showPage('dashboard');
  await loadData();
}

function editData(i){
  let x = data[i];

  jenis.value = x.jenis;
  tanggal.value = x.tanggal;
  nominal.value = rupiah(x.nominal);
  kategori.value = x.kategori;
  catatan.value = x.catatan;

  editIndex = i;
  showPage('catat');
}

async function hapusData(i){
  if(!confirm("Hapus transaksi?")) return;

  await sb.from('transaksi')
    .delete()
    .eq('id', data[i].id);

  loadData();
}

function render(){

  let totalMasuk=0;
  let totalKeluar=0;
  let totalTabungan=0;
  let totalBPJS=0;
  let totalMahesa=0;

  list.innerHTML = "";
  gajiList.innerHTML = "";

  data.forEach((x,i)=>{

    if(x.jenis==="masuk"){
      totalMasuk += x.nominal;
      gajiList.innerHTML += `
        <div class="item">
          ${formatTanggal(x.tanggal)}
          <div class="green">${rupiah(x.nominal)}</div>
        </div>`;
    }

    if(x.jenis==="keluar") totalKeluar += x.nominal;
    if(x.jenis==="tabungan") totalTabungan += x.nominal;
    if(x.jenis==="bpjs") totalBPJS += x.nominal;
    if(x.jenis==="mahesa") totalMahesa += x.nominal;

    let warna = x.jenis==="masuk" ? "green" : "red";
    let tanda = x.jenis==="masuk" ? "+" : "-";

    list.innerHTML += `
      <div class="item">
        <b>${x.kategori || x.jenis}</b>
        <div class="${warna}">${tanda} ${rupiah(x.nominal)}</div>
        <div class="small">
          ${formatTanggal(x.tanggal)}<br>
          ${x.catatan || "-"}
        </div>
        <button onclick="editData(${i})">✏️ Edit</button>
        <button onclick="hapusData(${i})">🗑️ Hapus</button>
      </div>
    `;
  });

  saldo.innerText = rupiah(totalMasuk - totalKeluar - totalTabungan);
  masuk.innerText = rupiah(totalMasuk);
  keluar.innerText = rupiah(totalKeluar);

  tabunganManual.innerText = rupiah(totalTabungan);
  bpjsManual.innerText = rupiah(totalBPJS);
  mahesaManual.innerText = rupiah(totalMahesa);
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

tampilTanggal();
loadData();

</script>

</body>
</html>
